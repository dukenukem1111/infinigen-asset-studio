name: Test and package
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_core.py'
      - run: python -m unittest discover -s tests -p 'test_installation.py'
      - run: python scripts/build_release.py
      - run: python scripts/validate_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Blender-addon
          path: dist/InfinigenAssetStudio-*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/InfinigenAssetStudio-* --verify-tag --generate-notes
